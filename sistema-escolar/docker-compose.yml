# Sobe o sistema completo com um comando:  docker compose up -d
#   Sistema ......... http://localhost:8080
#   phpMyAdmin ...... http://localhost:8081   (usuário: root | senha: root)
#   MySQL ........... localhost:3306          (para Workbench, DBeaver, HeidiSQL...)
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Sao_Paulo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./database/escola_db.sql:/docker-entrypoint-initdb.d/01-escola_db.sql:ro
      - dados_mysql:/var/lib/mysql

  app:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: escola_db
      DB_USER: root
      DB_PASS: root
    ports:
      - "8080:80"

  phpmyadmin:
    image: phpmyadmin:5
    depends_on:
      - db
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"

volumes:
  dados_mysql:
